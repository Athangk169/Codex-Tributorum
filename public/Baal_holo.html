<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAAL — PLANETARY SURVEY</title>

    <link rel="stylesheet" href="holo/holo.css" />
    <style>

        --label:            #ff4400;

        --label-border:     rgba(255, 68, 0, 0.5);
        --label-dot:        #ff1100;

        --sweep-a:          rgba(255, 40, 0, 0.03);

        --sweep-c:          rgba(255, 120, 0, 0.06);
        --point-glow:       rgba(255, 100, 0, 0.9);
        --point-aura:       rgba(255, 40, 0, 0.5);
        --beam:             rgba(255, 80, 0, 0.6);
        --noise:            rgba(255, 40, 0, 0.04);

        --stop:             rgba(255, 50, 0, 0.7);
        --stop-border:      rgba(255, 50, 0, 0.4);

        --screen-divider:   rgba(255, 50, 0, 0.3);

    <script src="three.min.js"></script>
    <script src="holo/holo-core.js"></script>
  </head>
  <body>
    <script>
      // ==========================================
      // BAAL TEXTURE BAKE
      // Uses a NASA Mars Viking color mosaic as the surface base, then
      // shader-transforms it into Baal: deeper blood-red hue, polar ice
      // caps replaced with rust/cinder (Baal has no ice), dried-blood
      // streaks, additional crater shadowing. Procedural noise breaks
      // up obvious Mars landmarks so it doesn't read as "just Mars".
      // ==========================================
      function loadImageTex(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.needsUpdate = true;
            resolve(tex);
          };
          img.onerror = () => reject(new Error("Failed to load " + src));
          img.src = src;
        });
      }

      async function bakeBaalTexture(renderer) {
        const marsTex = await loadImageTex("holo/textures/baal_base.jpg");

        const SZ_W = 2048, SZ_H = 1024;  // equirectangular 2:1
        const bakeScene = new THREE.Scene();
        const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const mat = new THREE.ShaderMaterial({
          uniforms: { marsMap: { value: marsTex } },
          vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }",
          fragmentShader: `
            uniform sampler2D marsMap;
            varying vec2 vUv;

            float hash21(vec2 p) { p = fract(p * vec2(127.319, 311.874)); p += dot(p, p + 38.45); return fract(p.x * p.y); }
            float sn(vec2 p) { vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f); return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y); }
            float fbm(vec2 p) { float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*sn(p); a*=0.5; p=p*2.0+vec2(1.7,9.2); } return v; }

            void main() {
              vec2 uv = vUv;

              // Sample Mars; warp slightly so famous Mars features (Olympus
              // Mons, Valles Marineris) don't read as themselves.
              float warpX = fbm(uv * 3.5) * 0.06;
              float warpY = fbm(uv * 3.5 + vec2(11.2, 7.7)) * 0.04;
              vec3 mars = texture2D(marsMap, uv + vec2(warpX, warpY)).rgb;
              float light = dot(mars, vec3(0.299, 0.587, 0.114));

              // Push hue toward blood-red: amp red, suppress green/blue.
              vec3 blood = vec3(mars.r * 1.20, mars.g * 0.45, mars.b * 0.18);

              // Deeper rust in low-luminance areas (crater shadows, basins).
              vec3 cinder = vec3(0.42, 0.10, 0.025);
              float darkness = 1.0 - light;
              blood = mix(blood, cinder * blood.r * 1.8, darkness * 0.45);

              // Polar caps are pure ice on Mars; Baal has none. Detect them
              // by lightness + latitude, replace with cinder/dust.
              float polarLat = clamp((abs(uv.y - 0.5) * 2.0 - 0.78) * 5.0, 0.0, 1.0);
              float capMask = polarLat * smoothstep(0.55, 0.90, light);
              vec3 dust = vec3(0.55, 0.16, 0.04);
              blood = mix(blood, dust, capMask);

              // Dried-blood streaks running east-west.
              float streak = fbm(vec2(uv.x * 48.0, uv.y * 2.5)) * 0.18;
              blood += vec3(0.85, 0.18, 0.02) * streak * 0.55;

              // Crater-edge highlight: bright rim where Mars is bright AND
              // adjacent to a darker patch. Approximated with high-freq noise.
              float rimNoise = sn(uv * 180.0);
              float rim = step(0.92, rimNoise) * smoothstep(0.30, 0.65, light) * 0.6;
              blood += vec3(1.0, 0.45, 0.10) * rim;

              // Fine grain across the whole surface.
              float grain = (sn(uv * 1100.0) - 0.5) * 0.08;
              blood += vec3(grain, grain * 0.5, grain * 0.2);

              // Equatorial heat band (subtle warmer wash near equator).
              float eqBand = exp(-pow((uv.y - 0.5) * 3.0, 2.0)) * 0.08;
              blood += vec3(1.0, 0.35, 0.05) * eqBand;

              // Limb darkening hint (drops brightness near top/bottom of UV).
              float latFactor = abs(uv.y - 0.5) * 2.0;
              blood *= 1.0 - latFactor * latFactor * 0.30;

              gl_FragColor = vec4(clamp(blood, 0.0, 1.0), 1.0);
            }
          `
        });
        bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
        const target = new THREE.WebGLRenderTarget(SZ_W, SZ_H, {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBFormat,
          encoding: THREE.sRGBEncoding
        });
        renderer.setRenderTarget(target);
        renderer.render(bakeScene, bakeCam);
        renderer.setRenderTarget(null);
        mat.dispose();
        marsTex.dispose();
        target.texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        target.texture.userData = target.texture.userData || {};
        target.texture.userData.renderTarget = target;
        return target.texture;
      }

      // ==========================================
      // BAAL EXTRAS (rad-storm sphere)
      // ==========================================
      function buildBaalExtras({ sceneGroup }) {
        const stormMat = new THREE.ShaderMaterial({
          uniforms: { time: { value: 0 } },
          vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
          fragmentShader: `
            uniform float time; varying vec2 vUv;
            float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
            float noise(vec2 p) {
              vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                         mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
            }
            float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); a *= 0.5; p *= 2.0; } return v; }
            void main() {
              vec2 p = vUv * 6.0; p.x += time * 0.03;
              float n = fbm(p + fbm(p + time * 0.02));
              float mask = smoothstep(0.4, 0.8, n);
              gl_FragColor = vec4(1.0, 0.3, 0.0, mask * 0.35);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const radStorm = new THREE.Mesh(new THREE.SphereGeometry(15.2, 64, 64), stormMat);
        sceneGroup.add(radStorm);
        return {
          update(time) { stormMat.uniforms.time.value = time; }
        };
      }

      // ==========================================
      // BOOT
      // ==========================================
      HoloCore.create({
        title:        "[ PLANETARY SURVEY : BAAL ]",
        subtitle:     "BLOOD ANGELS HOMEWORLD — SEGMENTUM TEMPESTUS — REF: 001–BAAL–PRIME",
        loadingText:  "[ ACCESSING MECHANICUS STELLAR ARCHIVE ]",
        brand:        "[ MECHANICUS STELLAR ARCHIVE ]",
        launchLabel:  "⬡ INITIATE PROJECTION",
        collapseLabel:"■ TERMINATE SIGNAL",
        hudInfo:      "CLASS: DEAD WORLD<br/>STATUS: IRRADIATED<br/>TITHE: ADEPTUS ASTARTES",

        bakeTexture: bakeBaalTexture,

        atmosphere: { color: 0xff4400, radius: 15.75, intensity: 1.2, power: 2.8, alpha: 0.75 },

        latLines: [
          { deg: 0,   color: 0xff3300, opacity: 0.18 },
          { deg: 30,  color: 0xff2200, opacity: 0.09 },
          { deg: -30, color: 0xff2200, opacity: 0.09 },
          { deg: 60,  color: 0xff1800, opacity: 0.05 },
          { deg: -60, color: 0xff1800, opacity: 0.05 }
        ],

        rings: [
          { inner: 17.2, outer: 17.5,  color: 0xff2200, opacity: 0.35, tiltX: Math.PI / 2,    pulse: { base: 0.28, amp: 0.12, freq: 1.3 } },
          { inner: 16.0, outer: 16.15, color: 0xff4400, opacity: 0.55, tiltX: Math.PI / 2,    pulse: { base: 0.45, amp: 0.15, freq: 2.1, phase: 1.0 } },
          { inner: 18.5, outer: 18.6,  color: 0xff1100, opacity: 0.20, tiltX: Math.PI / 2.8,  pulse: { base: 0.12, amp: 0.08, freq: 0.9, phase: 2.5 }, rotZ: 0.08 }
        ],

        scan: { color: 0xff5500, opacity: 0.6, speed: 5.5, rotSpeed: 0.4, pulseBase: 0.35, pulseAmp: 0.15, pulseFreq: 4 },

        lights: {
          sun:     { color: 0xff9955, intensity: 1.3,  position: [-6, 2, 5] },
          ambient: { color: 0x1a0500, intensity: 0.9 },
          rim:     { color: 0xff2200, intensity: 0.25, position: [5, -1, -6] }
        },

        beaconColor: 0xff4400,

        locations: [
          { name: "ARX ANGELICUM",        lat:  22, lon:   48, id: "arx",     desc: "FORTRESS-MONASTERY OF THE IX LEGION. RED GRAIL VAULTS SECURE. PRIMARY GARRISON RESPONSIVE." },
          { name: "MOUNT SERAPH",         lat: -10, lon: -120, id: "seraph",  desc: "MAXIMUM ELEVATION POINT. EXTREME RAD-STORM ACTIVITY DETECTED. SURFACE HABITABILITY ZERO." },
          { name: "THE GREAT SALT WASTE", lat: -45, lon:   80, id: "salt",    desc: "DESICCATED OCEAN BED. TOXIC MINERAL DEPOSITS. NO KNOWN BIOMASS." },
          { name: "THE DUST SEAS",        lat:  55, lon:  -40, id: "dust",    desc: "SHIFTING DUNES OF IRRADIATED SILICATE. NOMADIC FIRE SCORPION PREDATOR PRESENCE CONFIRMED." },
          { name: "KANEDON RUINS",        lat:  15, lon:  160, id: "kanedon", desc: "PRE-IMPERIAL HAB-RUINS. TECH-HERESY QUARANTINE IN EFFECT. SCAVENGING PROHIBITED." }
        ],

        buildExtras: buildBaalExtras
      });
    </script>
  </body>
