    <script>
      // ==========================================
      // TERRA PLANET TEXTURE BAKE
      //
      // Source: NASA Earth night-lights composite. Sampled as a density map
      // — bright pixels (cities) on the source mark the dense urban cores.
      // The shader then overlays a procedural lit hive-city grid ACROSS THE
      // ENTIRE PLANET, so former oceans glow too. Result: Earth's continental
      // silhouette remains (this is still Terra) but the surface reads as one
      // continuous ecumenopolis — gold/amber lit grid everywhere, no blue
      // oceans, no green biomes, no white polar ice.
      // ==========================================
      function loadImageTex(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.needsUpdate = true;
            resolve(tex);
          };
          img.onerror = () => reject(new Error("Failed to load " + src));
          img.src = src;
        });
      }

      async function bakeTerraTexture(renderer) {
        const earthNight = await loadImageTex("holo/textures/terra_base.jpg");

        const SZ_W = 2048, SZ_H = 1024; // equirectangular 2:1
        const bs = new THREE.Scene();
        const bc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const bm = new THREE.ShaderMaterial({
          uniforms: { earthNight: { value: earthNight } },
          vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }",
          fragmentShader: `
            uniform sampler2D earthNight;
            varying vec2 vUv;

            float hash21(vec2 p) { p = fract(p * vec2(127.319, 311.874)); p += dot(p, p + 38.45); return fract(p.x * p.y); }
            float sn(vec2 p) { vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f); return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y); }
            float fbm(vec2 p) { float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*sn(p); a*=0.5; p=p*2.0+vec2(1.7,9.2); } return v; }

            void main() {
              vec2 uv = vUv;

              // Sample Earth night-lights. Where this is bright = real Earth
              // city. Where dark = ocean or uninhabited land.
              vec3 nightSample = texture2D(earthNight, uv).rgb;
              float cityDensity = dot(nightSample, vec3(0.299, 0.587, 0.114));
              // Gamma-boost so faint clusters register.
              cityDensity = pow(cityDensity, 0.55);

              // Ecumenopolis grid: procedural blocks of buildings covering
              // the WHOLE planet (oceans included). Multiple scales = visual
              // depth/complexity from any zoom level.
              //
              // Micro-blocks (fine grid, ~individual buildings).
              vec2 bg = fract(uv * 320.0); vec2 bid = floor(uv * 320.0);
              float bGrid = max(step(0.88, bg.x), step(0.88, bg.y));
              float bRand = hash21(bid);
              float microCity = bGrid * smoothstep(0.30, 0.85, bRand);

              // Macro-blocks (large hive sectors).
              vec2 mg = fract(uv * 70.0); vec2 mid = floor(uv * 70.0);
              float mGrid = max(step(0.92, mg.x), step(0.92, mg.y));
              float mRand = hash21(mid + 0.5);
              float macroCity = mGrid * smoothstep(0.20, 0.90, mRand);

              // Mid-scale variation in district brightness so it's not uniform.
              float district = fbm(uv * 18.0);

              // Where Earth's real cities are = brighter. Where former
              // oceans/wilderness = still lit (ecumenopolis) but dimmer floor.
              float cityFloor = mix(0.32, 1.0, cityDensity);
              float surface = cityFloor * (microCity * 0.55 + macroCity * 0.35) * (0.55 + district * 0.55);
              // Real Earth city pixels punch through extra.
              surface += cityDensity * 0.7;

              // Color: deep amber base, mid amber, gold, hot-white at peaks.
              vec3 ash    = vec3(0.030, 0.012, 0.003);  // unlit valleys (none, really)
              vec3 deep   = vec3(0.080, 0.035, 0.010);  // ambient hive haze
              vec3 amber  = vec3(0.55, 0.22, 0.05);     // dim block
              vec3 gold   = vec3(1.00, 0.55, 0.12);     // active block
              vec3 hot    = vec3(1.00, 0.88, 0.45);     // peak hive
              vec3 imp    = vec3(1.00, 0.92, 0.62);     // Imperial cores

              vec3 col = mix(deep, amber, district);
              col = mix(col, gold, smoothstep(0.10, 0.55, surface));
              col = mix(col, hot,  smoothstep(0.45, 0.95, surface));
              // Real-city overlay extra punch.
              col += imp * cityDensity * 0.35;

              // Rare red-hot "industrial" pixels.
              float ind = step(0.992, hash21(uv * 1450.0));
              col += vec3(1.0, 0.35, 0.10) * ind * 0.9;

              // Cold-blue "void-shield" sparks (rare, defense grid blink).
              float spark = step(0.996, hash21(uv * 880.0 + vec2(4.2, 1.7)));
              col += vec3(0.55, 0.80, 1.00) * spark * 0.8;

              // Imperial Palace / Astronomican glow.
              // Lat 30 N, Lon ~80 E (Himalazia) -> equirect UV (0.722, 0.333).
              vec2 palUV = vec2(0.722, 0.333);
              float palD = length((uv - palUV) * vec2(1.0, 1.7));
              float pAura  = exp(-palD *  3.0) * 0.45;
              float pGlow1 = exp(-palD *  7.0) * 1.10;
              float pGlow2 = exp(-palD * 18.0) * 2.20;
              float pCore  = exp(-palD * 55.0) * 5.50;
              col += vec3(0.99, 0.83, 0.36) * pAura;
              col += vec3(0.99, 0.85, 0.40) * pGlow1;
              col += vec3(1.00, 0.92, 0.55) * pGlow2;
              col += vec3(1.00, 0.98, 0.85) * pCore;

              // Lion's Gate spaceport spike (lat 25 N, lon 75 E).
              vec2 lgUV = vec2(0.708, 0.361);
              float lgD = length(uv - lgUV);
              col += vec3(1.0, 0.85, 0.40) * exp(-lgD * 45.0) * 0.55;

              // Faint smog/cloud bands wrapping equatorially.
              float band = fbm(vec2(uv.x * 6.0, uv.y * 1.5)) * 0.10;
              col += vec3(1.0, 0.55, 0.12) * band * 0.18;

              // Polar dimming — even at the poles the planet is lit (no ice)
              // but it's slightly sparser / smoggier overhead.
              float polar = max(0.0, (abs(uv.y - 0.5) * 2.0 - 0.78) * 4.0);
              col *= 1.0 - polar * 0.45;
              // Add a sickly amber polar haze instead of cold blue.
              col += vec3(0.50, 0.22, 0.05) * polar * 0.20;

              gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
            }
          `
        });
        bs.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bm));
        const rt = new THREE.WebGLRenderTarget(SZ_W, SZ_H, {
          minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
          format: THREE.RGBFormat, encoding: THREE.sRGBEncoding
        });
        renderer.setRenderTarget(rt);
        renderer.render(bs, bc);
        renderer.setRenderTarget(null);
        bm.dispose();
        earthNight.dispose();
        rt.texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        rt.texture.userData = rt.texture.userData || {};
        rt.texture.userData.renderTarget = rt;
        return rt.texture;
      }

      // ==========================================
      // LUNA TEXTURE BAKE
      // ==========================================
      function bakeLunaTexture(renderer) {
        const SZ = 512;
        const bs = new THREE.Scene();
        const bc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const bm = new THREE.ShaderMaterial({
          uniforms: {},
          vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }",
          fragmentShader: `
            varying vec2 vUv;
            float h21(vec2 p){ p=fract(p*vec2(127.319,311.874)); p+=dot(p,p+38.45); return fract(p.x*p.y); }
            float sn(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f); return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y); }
            float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*sn(p); a*=0.5; p=p*2.1+vec2(1.7,9.2);} return v; }
            float crater(vec2 uv, vec2 c, float r){
              float d = length(uv-c)/r;
              if(d>1.4) return 0.0;
              float interior = smoothstep(0.0,0.7,d);
              float rim = exp(-pow((d-0.85)*5.0, 2.0));
              return -0.35*(1.0-interior) + 0.45*rim;
            }
            void main(){
              vec2 uv = vUv; float h = fbm(uv*5.0);
              h += crater(uv, vec2(0.25,0.35), 0.12); h += crater(uv, vec2(0.70,0.60), 0.09);
              h += crater(uv, vec2(0.45,0.75), 0.065); h += crater(uv, vec2(0.80,0.25), 0.080);
              h += crater(uv, vec2(0.15,0.64), 0.055); h += crater(uv, vec2(0.60,0.18), 0.070);
              h += crater(uv, vec2(0.38,0.50), 0.042); h += crater(uv, vec2(0.88,0.78), 0.048);
              h = clamp(h, 0.0, 1.0);
              float t = h*0.58+0.18;
              vec3 col = mix(vec3(0.14,0.13,0.12), vec3(0.72,0.70,0.66), t);
              gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
            }
          `
        });
        bs.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bm));
        const rt = new THREE.WebGLRenderTarget(SZ, SZ, {
          minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBFormat
        });
        renderer.setRenderTarget(rt);
        renderer.render(bs, bc);
        renderer.setRenderTarget(null);
        bm.dispose();
        rt.texture.userData = rt.texture.userData || {};
        rt.texture.userData.renderTarget = rt;
        return rt.texture;
      }

      // ==========================================
      // TERRA EXTRAS: Luna, defense platforms, fleets, beacon rings
      // ==========================================
      function buildTerraExtras({ scene, sceneGroup, renderer }) {
        // -- Luna (moon, orbits free of sceneGroup so it survives collapse animation correctly) --
        const lunaTex = bakeLunaTexture(renderer);
        const luna = new THREE.Mesh(
          new THREE.SphereGeometry(3.5, 48, 48),
          new THREE.MeshStandardMaterial({
            map: lunaTex,
            roughness: 0.95,
            metalness: 0.0,
            emissive: new THREE.Color(0.05, 0.042, 0.08),
            emissiveIntensity: 1.0
          })
        );
        sceneGroup.add(luna);

        // -- Defense platforms --
        function mkPlat(color) {
          const g = new THREE.Group();
          const cm = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.92, depthWrite: false, blending: THREE.AdditiveBlending });
          const wm = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending });

          const body = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.22, 0.22), cm);
          body.userData.baseOpacity = 0.92;
          g.add(body);

          const wL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.035, 0.58), wm);
          wL.userData.baseOpacity = 0.55;
          wL.position.z = -0.4;
          const wR = wL.clone();
          wR.material = wm;
          wR.userData.baseOpacity = 0.55;
          wR.position.z = 0.4;
          g.add(wL, wR);

          const fwd = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.1), wm);
          fwd.userData.baseOpacity = 0.55;
          fwd.position.x = 0.36;
          g.add(fwd);

          const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), cm);
          tip.userData.baseOpacity = 0.92;
          g.add(tip);
          return g;
        }

        const defPlatforms = [];
        [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3].forEach((ph) => {
          const m = mkPlat(0xffcc44);
          defPlatforms.push({ mesh: m, r: 16.45, rx: Math.PI / 2, rz: 0, phase: ph, speed: 0.16 });
        });
        [Math.PI / 4, (Math.PI * 3) / 4, (Math.PI * 5) / 4, (Math.PI * 7) / 4].forEach((ph) => {
          const m = mkPlat(0xffffcc);
          defPlatforms.push({ mesh: m, r: 15.515, rx: Math.PI / 2, rz: 0, phase: ph, speed: 0.22 });
        });
        [Math.PI * 0.25, Math.PI * 1.25].forEach((ph) => {
          const m = mkPlat(0xffeebb);
          defPlatforms.push({ mesh: m, r: 17.225, rx: 0, rz: 0, phase: ph, speed: 0.11 });
        });
        defPlatforms.forEach((p) => sceneGroup.add(p.mesh));

        // -- Beacon rings (pulsing emanations) --
        const beaconRings = [];
        for (let i = 0; i < 6; i++) {
          const geo = new THREE.RingGeometry(14.7, 15.3, 96);
          const mat = new THREE.MeshBasicMaterial({
            color: 0xffdd66, transparent: true, opacity: 0,
            depthWrite: false, blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.rotation.x = Math.PI / 2;
          sceneGroup.add(mesh);
          beaconRings.push({ mesh, mat, offset: i * 0.85 });
        }

        // -- Fleet traffic --
        const fleetGeo = new THREE.BufferGeometry();
        const FN = 800;
        const fPos = new Float32Array(FN * 3);
        const fCol = new Float32Array(FN * 3);
        for (let i = 0; i < FN; i++) {
          const r = 16.5 + Math.random() * 3.5;
          const th = Math.random() * Math.PI * 2;
          const ph = Math.acos(2 * Math.random() - 1);
          fPos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
          fPos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
          fPos[i * 3 + 2] = r * Math.cos(ph);
          const isGold = Math.random() > 0.5;
          fCol[i * 3]     = isGold ? 1.0 : 0.2;
          fCol[i * 3 + 1] = isGold ? 0.8 : 0.6;
          fCol[i * 3 + 2] = isGold ? 0.2 : 1.0;
        }
        fleetGeo.setAttribute("position", new THREE.BufferAttribute(fPos, 3));
        fleetGeo.setAttribute("color",    new THREE.BufferAttribute(fCol, 3));
        const fleets = new THREE.Points(fleetGeo, new THREE.PointsMaterial({
          size: 0.1, vertexColors: true,
          transparent: true, opacity: 0.8,
          blending: THREE.AdditiveBlending
        }));
        sceneGroup.add(fleets);

        // -- Update closure (reused scratch + stable base opacity) --
        const _pos = new THREE.Vector3();
        const _eul = new THREE.Euler();
        const BEACON_PERIOD = 4.8;

        return {
          update(time) {
            // Luna orbit
            const la = time * 0.11;
            luna.position.set(Math.cos(la) * 28, Math.sin(la) * 2.2, Math.sin(la) * 28);
            luna.rotation.y = Math.PI / 2 - la;

            // Fleets slow drift
            fleets.rotation.y = time * 0.04;
            fleets.rotation.z = time * 0.015;

            // Beacon rings: expand + fade
            const scaleAlpha = Math.min(1.0, sceneGroup.scale.x * 1.8);
            for (const r of beaconRings) {
              const t = ((time + r.offset) % BEACON_PERIOD) / BEACON_PERIOD;
              r.mesh.scale.setScalar(1.0 + t * 1.9);
              r.mat.opacity = (1.0 - t) * (1.0 - t) * 0.3 * scaleAlpha;
            }

            // Defense platforms: tilted orbit + opacity pulse around baseOpacity
            for (const p of defPlatforms) {
              const angle = time * p.speed + p.phase;
              _pos.set(p.r * Math.cos(angle), p.r * Math.sin(angle), 0);
              _eul.set(p.rx, 0, p.rz);
              _pos.applyEuler(_eul);
              p.mesh.position.copy(_pos);
              p.mesh.rotation.set(p.rx, angle + Math.PI / 2, p.rz);
              const pulse = Math.sin(time * 2.1 + p.phase) * 0.06;
              for (const c of p.mesh.children) {
                const base = c.userData.baseOpacity;
                if (base != null && c.material) c.material.opacity = base + pulse;
              }
            }
          }
        };
      }

      // ==========================================
      // BOOT
      // ==========================================
      HoloCore.create({
        title:        "[ THRONEWORLD SURVEY : TERRA ]",
        subtitle:     "GOD-EMPEROR'S SEAT — SEGMENTUM SOLAR — SOL SYSTEM — SOL III",
        loadingText:  "[ ACCESSING THRONEWORLD SIGNUM ]",
        brand:        "✠   ADEPTUS TERRA — SIGNUM IMPERIALIS   ✠",
        launchLabel:  "⬡ INITIATE IMPERIAL AUDIENCE",
        collapseLabel:"■ SEVER SIGNAL",
        hudInfo:
          "CLASS: ECUMENOPOLIS<br/>" +
          "STATUS: CAPITAL IMPERIALIS<br/>" +
          "TITHE: ADEPTUS TERRA — EXEMPT<br/>" +
          "AEGIS: DEFENSE GRID — ACTIVE [9 PLATFORMS]",
        astroStatus:
          "✦ ASTRONOMICAN SIGNAL NOMINAL<br/>" +
          "BEACON RANGE: SEGMENTUM SOLAR",
        sigil: "✠",
        screenPlaceholder: "[ DATUM PENDING UPLINK ]",

        bakeTexture: bakeTerraTexture,

        planetMaterial: {
          roughness: 0.82,
          metalness: 0.0,
          emissive: 0xffffff,
          emissiveIntensity: 0.22
        },

        atmosphere: { color: 0xffb71f, radius: 15.88, intensity: 1.2, power: 2.5, alpha: 0.82 },

        latLines: [
          { deg: 0,   color: 0xffcc00, opacity: 0.18 },
          { deg: 30,  color: 0xffaa00, opacity: 0.09 },
          { deg: -30, color: 0xffaa00, opacity: 0.09 },
          { deg: 60,  color: 0xff8800, opacity: 0.05 },
          { deg: -60, color: 0xff8800, opacity: 0.05 }
        ],

        rings: [
          { inner: 16.35, outer: 16.55, color: 0xffcc44, opacity: 0.55, tiltX: Math.PI / 2,    pulse: { base: 0.45, amp: 0.10, freq: 1.15 } },
          { inner: 17.15, outer: 17.30, color: 0xffeecc, opacity: 0.42, tiltX: 0,              pulse: { base: 0.30, amp: 0.10, freq: 1.80, phase: 1.0 }, rotY: 0.13 },
          { inner: 18.10, outer: 18.22, color: 0xffaa22, opacity: 0.30, tiltX: Math.PI / 3,    tiltZ: 0.4,  pulse: { base: 0.22, amp: 0.08, freq: 0.90, phase: 2.5 }, rotY: 0.08 },
          { inner: 15.45, outer: 15.58, color: 0xffffcc, opacity: 0.48, tiltX: Math.PI / 2,    pulse: { base: 0.38, amp: 0.12, freq: 2.30, phase: 0.5 } },
          { inner: 19.25, outer: 19.35, color: 0xff9900, opacity: 0.18, tiltX: Math.PI / 1.8,  tiltZ: 1.1,  pulse: { base: 0.13, amp: 0.07, freq: 1.10, phase: 1.8 }, rotY: -0.055 }
        ],

        scan: { color: 0xffcc00, opacity: 0.45, speed: 5.2, rotSpeed: 0.38, pulseBase: 0.28, pulseAmp: 0.12, pulseFreq: 4 },

        lights: {
          sun:     { color: 0xfff0dd, intensity: 1.1,  position: [-6, 2, 5] },
          ambient: { color: 0x060500, intensity: 0.7 },
          rim:     { color: 0xffaa00, intensity: 0.18, position: [5, -1, -6] }
        },

        beaconColor: 0xffaa00,

        locations: [
          { name: "IMPERIAL PALACE [HIMALAZIA]", lat:  30, lon:  80, id: "palace",    desc: "SEAT OF THE MASTER OF MANKIND. CONTINENT-SPANNING FORTRESS COMPLEX. ABSOLUTE AEGIS SANCTION IN EFFECT." },
          { name: "LION'S GATE SPACEPORT",        lat:  25, lon:  75, id: "lionsgate", desc: "PRIMARY ORBITAL TETHER. HEAVY VOID-TRAFFIC CONGESTION. ADEPTUS CUSTODES GARRISON CONFIRMED." },
